# ============================================================
# Render Blueprint — UnifAI Platform
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render dashboard and it will
# auto-provision the database, backend, and frontend.
# ============================================================

databases:
  - name: unifai-db
    databaseName: unifai
    user: unifai
    plan: free          # upgrade to starter ($7/mo) for production
    region: oregon      # match your web service region

services:
  # ----------------------------------------------------------
  # Backend — FastAPI (Python)
  # ----------------------------------------------------------
  - type: web
    name: unifai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    region: oregon
    plan: starter       # free tier has 512 MB RAM — too small for sentence-transformers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unifai-db
          property: connectionString   # Render injects postgresql://... automatically
      - key: SECRET_KEY
        generateValue: true            # Render generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: USE_LOCAL_PIPELINE
        value: "1"
      - key: EMBEDDING_MODEL_ID
        value: Qwen/Qwen3-Embedding-0.6B
      - key: GOOGLE_CLIENT_ID
        sync: false                    # set manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  # ----------------------------------------------------------
  # Frontend — React/Vite (served via Nginx)
  # ----------------------------------------------------------
  - type: web
    name: unifai-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: unifai-backend
          type: web
          property: host              # auto-wires backend URL into frontend build

